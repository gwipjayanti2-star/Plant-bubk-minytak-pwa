<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <style>
        /* Animasi loading sederhana */
        .loader { border-top-color: #10b981; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <div class="max-w-md mx-auto sm:my-10 bg-white sm:rounded-xl sm:shadow-lg overflow-hidden min-h-screen sm:min-h-0">
        
        <header class="bg-emerald-500 text-white p-5 text-center relative shadow-sm">
            <h1 class="text-2xl font-bold tracking-wide">PWA x Spreadsheet</h1>
            <p class="text-emerald-100 text-sm mt-1">Simpan dan baca data secara realtime</p>
        </header>
        
        <main class="p-6">
            <form id="dataForm" class="space-y-5 bg-gray-50 p-5 rounded-lg border border-gray-100 shadow-inner">
                <div>
                    <label for="nama" class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="nama" name="nama" required placeholder="Masukkan nama..." class="w-full border border-gray-300 rounded-md py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-colors">
                </div>
                <div>
                    <label for="deskripsi" class="block text-sm font-semibold text-gray-700 mb-1">Deskripsi / Pesan</label>
                    <textarea id="deskripsi" name="deskripsi" rows="3" required placeholder="Tulis sesuatu..." class="w-full border border-gray-300 rounded-md py-2.5 px-3 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-colors resize-none"></textarea>
                </div>
                <button type="submit" id="submitBtn" class="w-full flex justify-center items-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white bg-emerald-500 hover:bg-emerald-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all active:scale-95">
                    Kirim Data
                </button>
                <div id="statusMsg" class="text-center text-sm font-medium mt-2 hidden px-3 py-2 rounded"></div>
            </form>

            <div class="my-8 flex items-center">
                <div class="flex-grow border-t border-gray-200"></div>
                <span class="mx-4 text-gray-400 text-sm">Data Tersimpan</span>
                <div class="flex-grow border-t border-gray-200"></div>
            </div>
            
            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-700">Riwayat</h2>
                    <button id="refreshBtn" class="flex items-center text-sm bg-emerald-50 text-emerald-600 hover:bg-emerald-100 hover:text-emerald-700 py-1.5 px-3 rounded-full font-medium transition-colors">
                        <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Segarkan
                    </button>
                </div>
                <div id="dataList" class="space-y-4 max-h-80 overflow-y-auto pr-1 pb-4">
                    <div class="flex justify-center items-center h-20">
                        <div class="loader border-4 border-gray-200 rounded-full w-8 h-8"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // =========================================================
        // GANTI URL DI BAWAH INI DENGAN URL WEB APP GAS ANDA!
        // =========================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxWcN6AjX3FEI1is9CIlFA3OzJZ0PxMrkxWRmnS8pii_qae0N1PDDwm1GFSePgFVfWT/exec'; 
        
        const form = document.getElementById('dataForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMsg');
        const dataList = document.getElementById('dataList');
        const refreshBtn = document.getElementById('refreshBtn');

        // Mendaftarkan Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker terdaftar di scope:', reg.scope))
                    .catch(err => console.log('Service Worker gagal didaftarkan:', err));
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (SCRIPT_URL === 'GANTI_DENGAN_URL_WEB_APP_ANDA') {
                showStatus('Error: Masukkan URL Web App Apps Script di file HTML!', 'error');
                return;
            }

            const formData = {
                nama: document.getElementById('nama').value,
                deskripsi: document.getElementById('deskripsi').value
            };

            // UI State: Loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader border-2 border-white rounded-full w-4 h-4 mr-2"></div> Mengirim...';
            showStatus('Menyimpan data ke Spreadsheet...', 'info');

            try {
                // Menggunakan text/plain untuk menghindari preflight CORS request dari browser
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    showStatus('Berhasil disimpan!', 'success');
                    form.reset();
                    loadData(); // Reload data otomatis
                } else {
                    showStatus('Gagal: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('Gagal terhubung. Pastikan internet lancar dan URL Web App benar.', 'error');
                console.error(error);
            } finally {
                // UI State: Reset
                submitBtn.disabled = false;
                submitBtn.textContent = 'Kirim Data';
                setTimeout(() => statusMsg.classList.add('hidden'), 5000); // Sembunyikan pesan setelah 5 detik
            }
        });

        refreshBtn.addEventListener('click', loadData);

        async function loadData() {
            if (SCRIPT_URL === 'GANTI_DENGAN_URL_WEB_APP_ANDA') {
                dataList.innerHTML = `
                    <div class="bg-red-50 text-red-600 p-4 rounded-lg text-center text-sm border border-red-200">
                        Harap set URL Apps Script terlebih dahulu di dalam kode file index.html
                    </div>`;
                return;
            }

            dataList.innerHTML = '<div class="flex justify-center items-center h-20"><div class="loader border-4 border-gray-200 rounded-full w-8 h-8"></div></div>';
            
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                dataList.innerHTML = '';
                if (data.length === 0) {
                    dataList.innerHTML = '<p class="text-gray-500 text-sm text-center py-4 bg-gray-50 rounded-lg border border-dashed border-gray-300">Belum ada data di spreadsheet.</p>';
                    return;
                }

                // Membalik urutan agar data terbaru berada di atas
                data.reverse().forEach(item => {
                    // Coba baca header dengan huruf besar awal atau sama persis
                    const nama = item.Nama || item.nama || item.NAMA || 'Tanpa Nama';
                    const deskripsi = item.Deskripsi || item.deskripsi || item.DESKRIPSI || '-';
                    
                    let timeString = '';
                    if (item.Timestamp || item.timestamp) {
                        const date = new Date(item.Timestamp || item.timestamp);
                        timeString = isNaN(date) ? (item.Timestamp || item.timestamp) : date.toLocaleString('id-ID');
                    }

                    const card = document.createElement('div');
                    card.className = 'bg-white p-4 rounded-lg border border-gray-200 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden';
                    card.innerHTML = `
                        <div class="absolute left-0 top-0 w-1 h-full bg-emerald-400"></div>
                        <div class="font-bold text-gray-800 text-base">${nama}</div>
                        <div class="text-sm text-gray-600 mt-1.5 leading-relaxed">${deskripsi}</div>
                        ${timeString ? `<div class="text-xs text-gray-400 mt-3 flex items-center"><svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>${timeString}</div>` : ''}
                    `;
                    dataList.appendChild(card);
                });
            } catch (error) {
                dataList.innerHTML = '<div class="bg-red-50 text-red-500 text-sm p-4 rounded-lg text-center">Gagal memuat data. Cek koneksi Anda.</div>';
                console.error(error);
            }
        }

        function showStatus(text, type) {
            statusMsg.innerHTML = text;
            statusMsg.className = 'text-center text-sm font-medium mt-3 px-3 py-2 rounded-md transition-all';
            statusMsg.classList.remove('hidden');
            
            if (type === 'success') {
                statusMsg.classList.add('bg-green-100', 'text-green-700', 'border', 'border-green-200');
            } else if (type === 'error') {
                statusMsg.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-200');
            } else {
                statusMsg.classList.add('bg-blue-100', 'text-blue-700', 'border', 'border-blue-200');
            }
        }

        // Panggil data saat pertama kali aplikasi dibuka
        loadData();
    </script>
</body>
</html>
